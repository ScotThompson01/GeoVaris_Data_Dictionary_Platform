services:
  auth_test_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: geovaris_auth_test
      POSTGRES_USER: geovaris_auth_test
      POSTGRES_PASSWORD: auth_test_only_not_for_deployment
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U geovaris_auth_test -d geovaris_auth_test",
        ]
      interval: 2s
      timeout: 2s
      retries: 15
    networks:
      - default